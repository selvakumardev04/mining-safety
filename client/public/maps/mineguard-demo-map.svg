<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title description">
  <title id="title">Illustrative synthetic open-pit mine map</title>
  <desc id="description">Original demo map artwork showing an open pit, terraced contours, haul roads, processing area, water, vegetation and safety zones. Not a real mine survey.</desc>
  <defs>
    <linearGradient id="ground" x2="0" y2="1">
      <stop stop-color="#87927a"/>
      <stop offset="1" stop-color="#485c4f"/>
    </linearGradient>
    <linearGradient id="pit" x2=".8" y2="1">
      <stop stop-color="#c3a778"/>
      <stop offset="1" stop-color="#766447"/>
    </linearGradient>
    <linearGradient id="water" x2="0" y2="1">
      <stop stop-color="#68a9a3"/>
      <stop offset="1" stop-color="#39787c"/>
    </linearGradient>
    <pattern id="grain" width="32" height="32" patternUnits="userSpaceOnUse">
