      <circle cx="23" cy="19" r="1.3" fill="#20392d" opacity=".2"/>
      <path d="M8 27l5-2" stroke="#f2e6c9" stroke-opacity=".11"/>
    </pattern>
    <pattern id="grid" width="120" height="120" patternUnits="userSpaceOnUse">
